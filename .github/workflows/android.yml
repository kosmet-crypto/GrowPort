name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['index.html', 'pdfjs/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'pdfjs/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      # Fingerprint of what only an APK can deliver: the Android part and the bundled pdf.js (not the
      # web page). The app only offers an APK update when the newest release's fingerprint differs
      # from its own; web-only changes come in through WebUpdater.
      - name: Fingerprint the Android part
        run: echo "NATIVE_HASH=$(git ls-files -s android pdfjs | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"

      # sideload: the APK people install from Releases (updates itself).
      # play: the same app without self-updating, for Google Play later.
      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleSideloadRelease assemblePlayRelease
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk ../growport.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk ../growport-play.apk

      - uses: actions/upload-artifact@v4
        with:
          name: growport-apk
          path: |
            growport.apk
            growport-play.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/growport.apk
      # The tag must end in the app's versionCode (the run number, see android/app/build.gradle):
      # the in-app update check compares the number after the last dot with the installed version.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=${{ github.run_number }}
          gh release create "v0.1.$BUILD" growport.apk \
            --title "GrowPort 0.1.$BUILD" \
            --notes "Android build of commit ${{ github.sha }}. Download growport.apk below and open it on your phone to install or update. native: ${{ env.NATIVE_HASH }}"
