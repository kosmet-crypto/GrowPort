  if(!best) return side === 'skip' ? {date, side, type, name:nameToks.join(' ').replace(/^[-\s]+$/, '')} : {date, side, bad:true};
  const extra = best.groups.slice(0, best.tr.at).map(g => g.join(' '));
  const out = {date, side, name:nameToks.concat(extra).join(' ').trim(), qty:best.tr.qty, price:best.tr.price, total:best.tr.total};
  if(side === 'skip') out.type = type;
  return out;
}
function txFromCells(cells, cols){
  if(cols){
    const g = k => cols[k] != null ? cells[cols[k]] : undefined;
    const date = txDate(g('date'));
    if(!date) return null;
    const side = (cols.type != null ? txSide(g('type')) : 'buy') || 'skip';
    let qty = Math.abs(txNum(g('qty'))), price = Math.abs(txNum(g('price'))), total = Math.abs(txNum(g('total')));
    if(!(price > 0) && qty > 0 && total > 0) price = total / qty;
    if(!(total > 0) && qty > 0 && price > 0) total = qty * price;
    const name = String(g('name') || '').trim();
    const okNums = qty > 0 && (price > 0 || (isFinite(price) && !(total > 0)));
    if(!(price > 0)) price = okNums ? 0 : price;
    if(side === 'skip') return okNums ? {date, side, type:g('type'), name, qty, price, total:total || 0} : {date, side, type:g('type'), name};
    if(!okNums) return {date, side, bad:true};
    return {date, side, name, qty, price, total};
  }
  const di = cells.findIndex(c => txDate(c));
  if(di < 0) return null;
  const date = txDate(cells[di]);
  let side = null, ti = -1;
  cells.forEach((c, i) => { if(ti < 0 && i !== di && /^\p{L}/u.test(c) && txSide(c) !== 'skip'){ side = txSide(c); ti = i; } });
  if(ti < 0){ ti = cells.findIndex((c, i) => i > di && /^\p{L}/u.test(c)); side = 'skip'; }
  const nums = [], names = [];
  cells.forEach((c, i) => {
    if(i === di || i === ti) return;
    const v = txNum(c);
    if(isFinite(v)) nums.push(Math.abs(v)); else if(c && c !== '-') names.push(c);
  });
  const tr = txTriple(nums);
  const name = names.sort((a, b) => b.length - a.length)[0] || '';
  if(side === 'skip') return tr ? {date, side, type:cells[ti] || '', name, qty:tr.qty, price:tr.price, total:tr.total} : {date, side, type:cells[ti] || '', name};
  if(!tr) return {date, side, bad:true};
  return {date, side, name, qty:tr.qty, price:tr.price, total:tr.total};
}
// A row cut in two (date, type and name on one line, its numbers alone on the next or the
// previous line) is put back together.
function joinSplitRows(lines){
  const isNumLine = l => { const tk = l.trim().split(/\s+/); return tk.length >= 2 && tk.every(x => /^[-−+]?[\d.,']+%?$/.test(x) || /^[-–]$/.test(x)) && !tk.some(x => txDate(x)); };
  const endsWithNum = l => /[\d][.,]\d+\s*$/.test(l.trim());
  const out = [];
  for(let i = 0; i < lines.length; i++){
    const l = lines[i], tk = l.trim().split(/\s+/);
    if(tk.some(x => txDate(x)) && !endsWithNum(l)){
      if(i + 1 < lines.length && isNumLine(lines[i + 1])){ out.push(l + ' ' + lines[i + 1].trim()); i++; continue; }
      if(out.length && isNumLine(out[out.length - 1])){ out[out.length - 1] = l + ' ' + out[out.length - 1].trim(); continue; }
    }
    out.push(l);
  }
  return out;
}
function parseTransactions(text){
  let lines = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if(!lines.some(l => l.includes('\t') || l.includes(';'))) lines = joinSplitRows(lines);
  const count = ch => lines.filter(l => l.includes(ch)).length;
  const commaCsv = lines.length && (lines[0].match(/,/g) || []).length >= 3 && !/\d/.test(lines[0]);
  const delim = count('\t') >= lines.length / 2 ? '\t' : count(';') >= lines.length / 2 ? ';' : commaCsv ? ',' : null;
  let cols = null;
  const rows = [], skipped = {}, skippedRows = [], badRows = []; let bad = 0;
  for(const line of lines){
    let r;
    if(delim){
      const cells = splitCells(line, delim);
      if(!cells.some(c => txDate(c))){
        // Header row: map columns by name, earlier words in TX_HEAD win ("Beløp" before "Totale avgifter").
        const m = {}, low = cells.map(c => c.toLowerCase());
        for(const k of ['date', 'type', 'qty', 'price', 'total', 'name']){
          for(const w of TX_HEAD[k]){
            const i = low.findIndex((c, j) => c.includes(w) && !Object.values(m).includes(j));
            if(i >= 0){ m[k] = i; break; }
          }
        }
        if(m.date != null && m.qty != null) cols = m;
        continue;
      }
      r = txFromCells(cells, cols);
    } else r = txFromTokens(line.trim().split(/\s+/));
    if(!r) continue;
    const raw = line.replace(/\t+/g, ' | ').trim();
    if(r.side === 'skip' || !r.side){
      const k = String(r.type || '?').trim() || '?';
      if(/^(side|page|sida|страна)$/i.test(k)) continue;   // page footer with a print date
      // A dated row without a recognisable type may be a purchase the reader could not place: show it.
      if(/^[-?–]$/.test(k)){ badRows.push({raw, date:r.date, guess:txGuess(raw)}); continue; }
      skipped[k] = (skipped[k] || 0) + 1;
      // Skipped rows that move units (reinvested dividends, switches, fees paid in units…) are listed.
      if(r.qty > 0 && r.name) skippedRows.push(Object.assign({}, r, {type:k}));
      continue;
    }
    if(r.bad || !r.name){ bad++; badRows.push({raw, date:r.date, side:r.side, guess:txGuess(raw)}); continue; }
    rows.push(r);
  }
  return {rows, skipped, skippedRows, badRows, bad};
}
// Best guess for a row that could not be read: name words and the numbers in it, in order.
function txGuess(raw){
  const toks = raw.replace(/\|/g, ' ').split(/\s+/).filter(Boolean);
  const di = toks.findIndex(x => txDate(x));
  const rest = toks.slice(di + 1);
  const body = rest.slice(rest.length && txSide(rest[0]) !== 'skip' ? 1 : 0);
  let e = body.length;
  while(e > 0 && (/^[-−+]?[\d.,']+$/.test(body[e - 1]) || /^[-–]$/.test(body[e - 1]))) e--;
  const numToks = body.slice(e).filter(x => !/^[-–]$/.test(x)), name = body.slice(0, e).filter((x, i, a) => !(/^[-–]$/.test(x) && (i === 0 || i === a.length - 1)));
  // Join thousands groups ("3" "132,00") the most, then read units, price and total in order.
  const segs = numSegs(numToks).sort((a, b) => a.nums.length - b.nums.length);
  const nums = segs.length ? segs[0].nums.map(Math.abs) : [];
  const qty = nums[0], price = nums.length >= 3 ? nums[1] : nums.length === 2 && qty > 0 ? nums[1] / qty : undefined;
  return {name:name.join(' ').trim(), qty, price:price != null ? Math.round(price * 100) / 100 : undefined};
}

// PDF statements are read on the phone with Mozilla pdf.js, bundled in the APK next to this page
// (pdfjs/, see pdfjs/README.md) and loaded only when a PDF is picked. Older APKs without it, or the
// page opened on its own, fall back to the same version from jsDelivr. The PDF itself never leaves
// the device; text items are put back into lines by their position.
const PDFJS_CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/';
const PDFJS_SRC = [['pdfjs/pdf.min.js', 'pdfjs/pdf.worker.min.js'], [PDFJS_CDN + 'pdf.min.mjs', PDFJS_CDN + 'pdf.worker.min.mjs']];
let pdfjsReady = null;
function loadPdfJs(){
  if(!pdfjsReady) pdfjsReady = (async () => {
    for(const [lib, worker] of PDFJS_SRC){
      try{
        const L = await import(new URL(lib, location.href).href);
        // Run the worker from a blob of the same script (a worker from another origin is not allowed).
        const w = await fetch(new URL(worker, location.href).href).then(r => { if(!r.ok) throw new Error('worker'); return r.text(); });
        L.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], {type:'text/javascript'}));
        return L;
      }catch(e){}
    }
    throw new Error('pdfjs');
  })().catch(e => { pdfjsReady = null; throw e; });
  return pdfjsReady;
}
async function pdfToText(buf){
  const lib = await loadPdfJs();
  // Text only: no script evaluation, no fonts or other files fetched.
  const doc = await lib.getDocument({data:buf, isEvalSupported:false, disableFontFace:true, useSystemFonts:false, enableXfa:false}).promise;
  const out = [];
  for(let pn = 1; pn <= doc.numPages; pn++){
    const tc = await (await doc.getPage(pn)).getTextContent();
    const rows = [];
    // Items on one table row can sit a little higher or lower (e.g. the last row above a page
    // footer), so the tolerance follows the text height instead of a fixed few points.
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5], h = Math.abs(it.height || it.transform[3] || 10);
      const tol = Math.max(3, h * 0.6);
      let row = null, best = Infinity;
      for(const r of rows){ const d = Math.abs(r.y - y); if(d < tol && d < best){ best = d; row = r; } }
      if(!row){ row = {y, items:[]}; rows.push(row); }
      row.items.push({x, s:it.str});
    }
    rows.sort((a, b) => b.y - a.y);
    for(const r of rows) out.push(r.items.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join(' '));
  }
  return out.join('\n');
}

/* ---------- daily fund prices ---------- */
// Looks the fund up on Yahoo Finance by name and checks each candidate against the user's own
// purchase prices (median difference, allowing a day or two between order and price date), so a
// wrong fund or share class is never linked by accident.
async function findFundPrices(h){
  const ts = D.trades.filter(e => e.holdingId === h.id && e.price > 0);
  if(!ts.length) return [];
  const qs = [h.name, h.name.replace(/\s+[A-Z]$/, ''), h.name.replace(/\s+(indeks|index)\b.*$/i, '')];
  const seen = new Set(), cands = [];
  for(const q of [...new Set(qs)]){
    try{ for(const r of await searchTicker(q)) if(!seen.has(r.symbol) && cands.length < 8){ seen.add(r.symbol); cands.push(r); } }catch(e){}
    if(cands.length >= 3) break;
  }
  const from = Math.min(...ts.map(e => dnum(e.date)));
  const E = getEngine(), cur = h.currency || D.settings.baseCurrency;
  const out = [];
  for(const c of cands){
    try{
      const r = await fetchTicker(c.symbol, from);
      const S = makeSeries(r.prices);
      const errs = [];
      for(const e of ts){
        const n = dnum(e.date), a = E.fx(r.currency, n), b = E.fx(cur, n);
        if(a == null || b == null) continue;
        let best = null;
        for(let d = -1; d <= 2; d++){ const q = S.at(n + d); if(q != null){ const er = Math.abs(q * a / b / e.price - 1); if(best == null || er < best) best = er; } }
        if(best != null) errs.push(best);
      }
      errs.sort((x, y) => x - y);
      const last = Object.keys(r.prices).sort().pop();
      out.push({symbol:c.symbol, name:c.name, currency:r.currency, prices:r.prices, from, last, err:errs.length ? errs[errs.length >> 1] : null});
    }catch(e){}
  }
  return out.sort((a, b) => (a.err ?? 9) - (b.err ?? 9));
}
const PRICE_MATCH = 0.015;
function linkPrice(h, c){
  h.symbol = c.symbol;
  C.tick[c.symbol] = {currency:c.currency, prices:c.prices, at:Date.now(), from:c.from};
  saveCache(); saveData();
}
// After an import: link every fund with purchases but no daily price to a candidate that matches.
async function autoLinkPrices(ids){
  const hs = D.holdings.filter(h => h.type === 'fund' && !h.symbol && ids.includes(h.id));
  if(!hs.length) return;
  await refreshMarket();   // exchange rates for the purchase dates
  let found = 0;
  for(const h of hs){
    const best = (await findFundPrices(h))[0];
    if(best && best.err != null && best.err < PRICE_MATCH){ linkPrice(h, best); found++; }
  }
  toast(t('prices_found', {n:found, m:hs.length}));
  render(); if(page) renderPage();
  if(found) refreshMarket();
}
async function findPriceUI(h){
  const box = page && $('overlay').querySelector('.page #price-res');
  if(!box) return;
  box.innerHTML = `<div class="hint">${t('searching')}</div>`;
  const cs = await findFundPrices(h);
  if(!cs.length){ box.innerHTML = `<div class="hint">${t('no_price_found')}</div>`; return; }
  box.innerHTML = `<div class="results">${cs.map((c, i) => {
    const ok = c.err != null && c.err < PRICE_MATCH;
    const m = c.err == null ? t('match_unknown') : ok ? t('match_ok', {p:fmtPct(c.err, false)}) : t('match_bad', {p:fmtPct(c.err, false)});
    return `<button data-i="${i}"><b>${esc(c.symbol)}</b> · ${esc(c.name)}<br><span class="${ok ? 'good' : 'muted'}">${ok ? '✓ ' : ''}${esc(m)}</span></button>`;
  }).join('')}</div>`;
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    const c = cs[+b.dataset.i];
    if(!(c.err != null && c.err < PRICE_MATCH) && !confirm(t('link_anyway'))) return;
    linkPrice(h, c); render(); renderPage(); refreshMarket();
  });
}

/* ---------- holdings statement (stanje) ---------- */
// A position list from the platform: name, units, market value, price, price date, change kr,
// change %, cost price (Kostpris) and cost per unit. It has no purchase dates, so it never creates
// purchases; it only sets each fund's value on the price date and records the platform's cost price.
const ST_HEAD = {
  name:['verdipapir', 'navn', 'name', 'security', 'fond'],
  qty:['ant', 'units', 'quantity', 'beholdning'],
  mv:['markedsverdi', 'market value', 'verdi', 'value'],
  price:['pris per', 'kurs', 'price'],
  date:['kursdato', 'dato', 'date'],
  cost:['kostpris', 'cost'],
};
// Every way of joining neighbouring number tokens ("1 888,66" may arrive as "1" "888,66").
function numSegs(toks){
  const out = [];
  const walk = (i, groups) => {
    if(i === toks.length){ out.push(groups); return; }
    const tok = toks[i], last = groups[groups.length - 1];
    walk(i + 1, groups.concat([[tok]]));
    if(last && /^\d{3}([.,]\d+)?$/.test(tok) && /^[-−]?\d{1,3}$/.test(last[last.length - 1]) && !/[.,]/.test(last.join('')))
      walk(i + 1, groups.slice(0, -1).concat([last.concat([tok])]));
  };
  if(toks.length <= 12) walk(0, []);
  return out.map(g => ({groups:g, nums:g.map(x => txNum(x.join('')))}));
}
function stFromTokens(toks){
  const di = toks.findIndex(x => txDate(x));
  if(di < 1) return null;
  const pi = toks.findIndex((x, i) => i > di && /%$/.test(x));
  if(pi < 0) return null;
  const before = toks.slice(0, di);
  let e = before.length;
  while(e > 0 && /^[-−+]?[\d.,']+$/.test(before[e - 1])) e--;
  const numToks = before.slice(e);
  let best = null;
  for(const sg of numSegs(numToks).sort((a, b) => a.nums.length - b.nums.length)){
    const n = sg.nums.length;
    if(n < 3) continue;
    const [q, mv, pr] = sg.nums.slice(n - 3);
    if(q > 0 && pr > 0 && Math.abs(q * pr - mv) <= Math.max(0.01 * mv, 0.05)){ best = {sg, q, mv, pr}; break; }
  }
  if(!best) return {bad:true};
  const name = before.slice(0, e).concat(best.sg.groups.slice(0, best.sg.nums.length - 3).map(g => g.join(' '))).join(' ').trim();
  const change = txNum(toks.slice(di + 1, pi).join(''));
  let cost = null;
  for(const sg of numSegs(toks.slice(pi + 1)).sort((a, b) => a.nums.length - b.nums.length)){
    const c = sg.nums[0];
    if(isFinite(c) && c > 0 && (!isFinite(change) || Math.abs(best.mv - change - c) <= Math.max(1, 0.002 * c))){ cost = c; break; }
  }
  if(cost == null && isFinite(change)) cost = best.mv - change;
  return {name, qty:best.q, value:best.mv, price:best.pr, date:txDate(toks[di]), cost};
}
function parseStatement(text){
  const lines = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(!/markedsverdi|kostpris|market value/i.test(lines.join(' '))) return {rows:[]};
  const rows = [];
  const tabbed = lines.filter(l => l.includes('\t')).length >= 2;
  if(tabbed){
    let cols = null;
    for(const line of lines){
      const cells = line.split('\t').map(c => c.trim());
      if(!cols){
        const low = cells.map(c => c.toLowerCase()), m = {};
        for(const k of ['cost', 'date', 'mv', 'price', 'qty', 'name']){
          for(const w of ST_HEAD[k]){
            const i = low.findIndex((c, j) => c.includes(w) && !Object.values(m).includes(j) && !(k === 'cost' && /per/.test(c)) && !(k === 'price' && /kost/.test(c)));
            if(i >= 0){ m[k] = i; break; }
          }
        }
        if(m.qty != null && m.mv != null) cols = m;
        continue;
      }
      const g = k => cols[k] != null ? cells[cols[k]] : '';
      const qty = txNum(g('qty')), value = txNum(g('mv'));
      if(!(qty > 0) || !(value > 0) || !String(g('name')).trim()) continue;
      const cost = txNum(g('cost'));
      rows.push({name:g('name').trim(), qty, value, price:txNum(g('price')) || value / qty, date:txDate(g('date')) || todayStr(), cost:cost > 0 ? cost : null});
    }
    return {rows};
  }
  // Plain text / PDF: a long name may wrap onto the lines around its numbers.
  const isData = l => { const tk = l.split(/\s+/); return tk.some(x => txDate(x)) && tk.some(x => /%$/.test(x)); };
  const isText = l => !isData(l) && /\p{L}/u.test(l) && l.split(/\s+/).length >= 2 && !/\d[\d\s.,]*%/.test(l)
    && !/markedsverdi|kostpris|verdipapir|totalt|^sum\b/i.test(l);
  lines.forEach((l, i) => {
    if(!isData(l)) return;
    const toks = l.split(/\s+/);
    // Without a name in front, the date token comes right after the numbers: give it the wrapped name.
    const r = stFromTokens(/^[-−+]?[\d.,']+$/.test(toks[0]) ? ['?'].concat(toks) : toks);
    if(!r || r.bad) return;
    if(r.name === '?' || !r.name){
      const parts = [];
      if(i > 0 && isText(lines[i - 1])) parts.push(lines[i - 1]);
      if(i + 1 < lines.length && isText(lines[i + 1])) parts.push(lines[i + 1]);
      r.name = parts.join(' ').trim();
    } else if(/[-–,]$/.test(r.name) && i + 1 < lines.length && isText(lines[i + 1])){
      r.name += ' ' + lines[i + 1];   // name wrapped after its first words
    }
    if(r.name) rows.push(r);
  });
  return {rows};
}
// Loose name match: ignores ISIN codes, case and punctuation; one name may contain the other.
function nameKey(s){ return String(s || '').replace(/\b[A-Z]{2}[A-Z0-9]{9}\d\b/g, ' ').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ''); }
function matchHolding(name){
  const k = nameKey(name);
  if(!k) return null;
  const hs = D.holdings.filter(h => h.type !== 'btc');
  const exact = hs.find(h => nameKey(h.name) === k);
  if(exact) return exact;
  // Loose match (a name cut by a line break, an ISIN prefix): of several candidates take the one
  // closest in length, so "… ETF" beats a stray "… ETF 0,1417".
  const loose = hs.filter(h => { const hk = nameKey(h.name); return hk.length > 5 && (k.includes(hk) || hk.includes(k)); });
  loose.sort((a, b) => Math.abs(nameKey(a.name).length - k.length) - Math.abs(nameKey(b.name).length - k.length));
  return loose[0] || null;
}
function unitsAt(h, date){
  let q = 0;
  for(const e of D.trades) if(e.holdingId === h.id && e.date <= date) q += e.side === 'sell' ? -(+e.qty || 0) : (+e.qty || 0);
  return q;
}
function showStatement(sh, prev, rows){
  const base = D.settings.baseCurrency;
  prev.innerHTML = `<div style="font-weight:600;margin:4px 0 8px">${esc(t('st_found', {n:rows.length}))}</div>
    ${rows.map((r, i) => {
      const h = matchHolding(r.name);
      return `<div class="card" style="padding:10px 12px;margin-bottom:8px"><div style="font-weight:600">${esc(r.name)}</div>
        <div class="hint" style="margin:2px 0 6px">${esc(fmtNum(r.qty, 4))} · ${esc(fmtMoney(r.value, {cur:base, digits:2}))} · ${esc(fmtDate(r.date))}</div>
        <select class="inp" data-st="${i}"><option value="">${esc(t('st_skip'))}</option>${D.holdings.filter(x => x.type !== 'btc').map(x => `<option value="${x.id}" ${h === x ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        <div class="st-check" data-stc="${i}" style="font-size:13px;margin-top:6px"></div></div>`;
    }).join('')}
    <button class="btn" id="x-st-go" style="margin-top:8px">${esc(t('st_go'))}</button>`;
  const check = i => {
    const r = rows[i], hid = prev.querySelector(`[data-st="${i}"]`).value, box = prev.querySelector(`[data-stc="${i}"]`);
    if(!hid){ box.innerHTML = `<span class="muted">${esc(t('st_missing'))}</span>`; return; }
    const h = D.holdings.find(x => x.id === hid), q = unitsAt(h, r.date);
    const diff = r.qty - q, money = Math.abs(diff) * (r.price || r.value / r.qty);
    const exact = Math.abs(diff) <= Math.max(1e-4, r.qty * 1e-5);
    // The platform rounds units in the statement; a difference worth a few kroner is just that.
    const rounding = !exact && money <= Math.max(10, r.value * 0.001);
    box.innerHTML = exact ? `<span class="good">✓ ${esc(t('st_units_ok', {q:fmtNum(r.qty, 4)}))}</span>`
      : rounding ? `<span class="good">✓ ${esc(t('st_units_round', {d:fmtNum(diff, 4), v:fmtMoney(money, {digits:2})}))}</span>`
      : `<span class="bad">⚠ ${esc(t('st_units_diff', {k:fmtNum(r.qty, 4), a:fmtNum(q, 4), d:fmtNum(diff, 4)}))} (≈ ${esc(fmtMoney(money))})</span>`;
  };
  rows.forEach((r, i) => { check(i); prev.querySelector(`[data-st="${i}"]`).onchange = () => check(i); });
  prev.querySelector('#x-st-go').onclick = () => {
    const E = getEngine();
    let n = 0;
    rows.forEach((r, i) => {
      const hid = prev.querySelector(`[data-st="${i}"]`).value;
      const h = hid && D.holdings.find(x => x.id === hid);
      if(!h) return;
      // The statement is in the main currency; entries are kept in the holding's currency.
      const m = E.fx(h.currency || base, dnum(r.date)) || 1;
      // Stocks/ETFs follow their live price; only funds take the statement value as an entry.
      if(h.type === 'fund'){
        D.entries = D.entries.filter(x => !(x.holdingId === h.id && x.date === r.date));
        D.entries.push({id:uid(), holdingId:h.id, date:r.date, value:r.value / m, ret:null});
      }
      h.statement = {date:r.date, qty:r.qty, value:r.value, cost:r.cost};
      n++;
    });
    saveData(); closeSheet();
    toast(t('st_done', {n}));
    render(); if(page) renderPage(); refreshMarket();
  };
}

      }).filter(Boolean);
      const extra = () => skippedRows.map((r, i) => ({r, side:prev.querySelector(`[data-skip="${i}"]`).value})).filter(x => x.side);

function loadDemo(){

  const f1 = {id:uid(), type:'fund', name:'Global Index Fund (demo)', accountId:a1.id, currency:'NOK'};

  const s = {id:uid(), type:'ticker', name:'iShares Core S&P 500 UCITS ETF', symbol:'SXR8.DE', accountId:a2.id, currency:'EUR'};
  const entries = [];
  let paid = 50000, val = 50000, paid2 = 20000, val2 = 21000;
  for(let k = 24; k >= 0; k -= 2){
    const n = T - k * 30;
    const g = 1 + 0.018 + 0.03 * Math.sin(k * 1.3);
    val = val * g + 5000; paid += 5000;
    val2 = val2 * (1 + 0.01 + 0.04 * Math.cos(k)) + 1000; paid2 += 1000;
    // The oldest two entries have no return: they show as history only.
    entries.push({id:uid(), holdingId:f1.id, date:dstr(n), value:Math.round(val), ret:k > 20 ? null : Math.round(val - paid)});
    entries.push({id:uid(), holdingId:f2.id, date:dstr(n), value:Math.round(val2), ret:Math.round(val2 - paid2)});
  }
  D.accounts = [a1, a2]; D.holdings = [f1, f2, b, s]; D.entries = entries;
  D.trades = [
    {id:uid(), holdingId:b.id, date:dstr(T - 600), side:'buy', qty:0.02, amount:6500},

    {id:uid(), holdingId:s.id, date:dstr(T - 200), side:'buy', qty:5, price:560, fee:5}
  ];
  D.demo = true;
  saveData(); render(); refreshMarket();
}

  el.textContent = msg;

document.addEventListener('click', e => {

  const d = b.dataset;
  if(d.tab){ tab = d.tab; UI.tab = tab; saveUI(); window.scrollTo(0, 0); render(); return; }

  if(d.v && b.parentElement.dataset.act === 'mode'){ UI.chartMode = d.v; saveUI(); render(); return; }
  if(d.openHolding){ openPage({type:'holding', id:d.openHolding}); return; }
  if(d.toggleAccount){ UI.closedAcc = Object.assign({}, UI.closedAcc); if(UI.closedAcc[d.toggleAccount]) delete UI.closedAcc[d.toggleAccount]; else UI.closedAcc[d.toggleAccount] = 1; saveUI(); render(); return; }
  if(d.openAccount){ openPage({type:'account', id:d.openAccount}); return; }
  if(d.editEntry){ const en = D.entries.find(x => x.id === d.editEntry); const h = en && D.holdings.find(x => x.id === en.holdingId); if(h) entryForm(h, en); return; }
  if(d.editTrade){ const tr = D.trades.find(x => x.id === d.editTrade); const h = tr && D.holdings.find(x => x.id === tr.holdingId); if(h) tradeForm(h, tr); return; }
  if(d.editAccount){ accountForm(D.accounts.find(x => x.id === d.editAccount)); return; }
  if(d.delRate){ D.rateChanges = D.rateChanges.filter(x => x.month !== d.delRate); saveData(); render(); return; }
  const h = page && page.type === 'holding' ? D.holdings.find(x => x.id === page.id) : null;
  switch(d.act){
    case 'refresh': refreshMarket(true); break;
    case 'add-holding': holdingForm(); break;
    case 'add-account': accountForm(); break;
    case 'edit-holding': if(h) holdingForm(h); break;
    case 'edit-account': if(page && page.type === 'account') accountForm(D.accounts.find(x => x.id === page.id)); break;
    case 'clear-account': {
      // Removes every holding of this account with its purchases, sales and value entries; the account stays.
      const a = page && page.type === 'account' && D.accounts.find(x => x.id === page.id);
      if(!a) break;
      const ids = D.holdings.filter(x => x.accountId === a.id).map(x => x.id);
      if(!ids.length || !confirm(t('clear_account_confirm', {n:ids.length, a:a.name}))) break;
      D.holdings = D.holdings.filter(x => !ids.includes(x.id));
      D.entries = D.entries.filter(x => !ids.includes(x.holdingId));
      D.trades = D.trades.filter(x => !ids.includes(x.holdingId));
      saveData(); render(); renderPage(); toast(t('clear_account_done', {n:ids.length}));
      break;
    }
    case 'new-entry': if(h) entryForm(h); break;
    case 'new-trade': if(h) tradeForm(h); break;
    case 'find-price': if(h) findPriceUI(h); break;
    case 'unlink-price': if(h && confirm(t('confirm_del'))){ delete h.symbol; saveData(); render(); renderPage(); } break;
    case 'stats': tab = 'stats'; UI.tab = tab; saveUI(); window.scrollTo(0, 0); render(); break;
    case 'back': history.back(); break;
    case 'add-rate': rateForm(); break;
    case 'export': exportBackup(); break;
    case 'import': $('import-file').click(); break;
    case 'import-tx': importTxForm(); break;
    case 'demo': loadDemo(); break;
    case 'demo-clear': { const s = D.settings; D = defaultData(); D.settings = s; saveData(); render(); break; }
    case 'wipe': if(confirm(t('wipe_confirm'))){ const s = D.settings; D = defaultData(); D.settings = s; saveData(); render(); } break;
    case 'all-months': UI.allMonths = true; render(); break;
    case 'check-update': if(NATIVE && NATIVE.checkForUpdate) NATIVE.checkForUpdate(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'import-file' && el.files[0]){ importBackup(el.files[0]); el.value = ''; return; }
  if(el.dataset.act === 'scope'){ UI.statsScope = el.value; saveUI(); render(); return; }
  const k = el.dataset.set;
  if(!k) return;
  let v = el.value;
  if(el.hasAttribute('data-pct')){ v = parseNum(v) / 100; if(!isFinite(v)){ toast(t('required')); return; } }
  const before = D.settings[k];
  D.settings[k] = v;
  saveData();
  if((k === 'baseCurrency' || k === 'inflSource') && before !== v) refreshMarket();
  render();
  if(k !== 'language' && k !== 'theme') toast(t('saved'));
});
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { afterRender(document.body); }, 150); });

/* ================= start ================= */
D = normalize(loadJSON(LS_DATA)) || defaultData();
C = Object.assign(emptyCache(), loadJSON(LS_CACHE) || {});
UI = loadJSON(LS_UI) || {};
tab = UI.tab || 'home';
UI.allMonths = false;
render();
if(NATIVE && NATIVE.ready) NATIVE.ready();
if(D.holdings.length && Date.now() - (C.at || 0) > 10 * 60e3) refreshMarket();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && D.holdings.length && Date.now() - (C.at || 0) > 30 * 60e3) refreshMarket();
});
</script>
</body>
</html>
